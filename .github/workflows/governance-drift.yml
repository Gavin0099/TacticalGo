name: Governance Drift

# The framework is a pinned submodule (additional/ai-governance-framework), so this job can run.
# Triggers are deliberately narrow (Owner wants to avoid wasteful CI): manual, or a pull request that touches
# governance files or the inputs of the golden-fixture validator. It is NOT run on every push.
# NOTE (2026-10-14): Actions was disabled at repository level and was re-enabled the same day (GitHub-owned
# actions only); see docs/GOVERNANCE_SETUP.md.
# Least privilege stated in the file itself rather than relying on the repository's default token permissions.
permissions:
  contents: read

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - ".governance/**"
      - "AGENTS.base.md"
      - "AGENTS.md"
      - "contract.yaml"
      - "validators/**"
      - "governance/**"
      - "additional/ai-governance-framework"
      - ".gitmodules"
      # inputs of validators/golden_fixture_validator.py: fixtures and the engine vocabulary it reads
      - "tests/golden/**"
      - "src/TacticalGo.Domain/Actions.cs"
      - "src/TacticalGo.Domain/ActionEvent.cs"
      - ".github/workflows/governance-drift.yml"
      # managed hook configs: a re-deployed VS Code Stop -> session_end wiring must be caught here
      - ".github/hooks/**"

jobs:
  governance-drift:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run governance drift check
        run: |
          python additional/ai-governance-framework/governance_tools/governance_drift_checker.py \
            --repo . \
            --framework-root additional/ai-governance-framework \
            --format human

      - name: Run repo-specific validator (golden fixtures)
        run: python validators/golden_fixture_validator.py .

      - name: Run validator unit tests (negative cases)
        run: python -m unittest discover -s validators -p "test_*.py" -v

      - name: Check managed hook wiring (VS Code Stop must not close out a session)
        run: python validators/hook_wiring_check.py .
