name: Governance Drift

# The framework is a pinned submodule (additional/ai-governance-framework), so this job can run.
# Triggers are deliberately narrow (Owner wants to avoid wasteful CI): manual, or a pull request that touches
# governance files. It is NOT run on every push. It has not yet been observed running on GitHub; the same command
# was run locally and reported severity=ok.
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - ".governance/**"
      - "AGENTS.base.md"
      - "AGENTS.md"
      - "contract.yaml"
      - "validators/**"
      - "governance/**"
      - "additional/ai-governance-framework"
      - ".gitmodules"

jobs:
  governance-drift:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run governance drift check
        run: |
          python additional/ai-governance-framework/governance_tools/governance_drift_checker.py \
            --repo . \
            --framework-root additional/ai-governance-framework \
            --format human

      - name: Run repo-specific validator (golden fixtures)
        run: python validators/golden_fixture_validator.py .
