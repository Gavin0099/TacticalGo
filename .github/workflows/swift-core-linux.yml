name: Swift Core (Linux)

# Evidence for the platform-neutral part of the Swift package only (rules, records, access ledger). It does NOT
# cover the iOS app, UI tests, StoreKit, audio or any Apple-only framework. Narrow triggers on purpose (Owner wants
# to avoid wasteful CI): manual, or a pull request touching the package.
permissions:
  contents: read

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "swift/TacticalGoCore/**"
      - "scripts/tg12-p0-research/**"
      - ".github/workflows/swift-core-linux.yml"

jobs:
  swift-test-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container: swift:6.0
    steps:
      - uses: actions/checkout@v4
      - name: Swift unit tests (Debug)
        working-directory: swift/TacticalGoCore
        shell: bash
        run: |
          set -o pipefail
          swift test --skip TG12GameplayResearchTests 2>&1 | tee swift-unit.log
      - name: TG12 gameplay research (Release)
        working-directory: swift/TacticalGoCore
        env:
          TG12_RESEARCH_OUTPUT: ${{ github.workspace }}/swift/TacticalGoCore/tg12-research.json
        shell: bash
        run: |
          set -o pipefail
          swift test -c release --filter TG12GameplayResearchTests 2>&1 | tee tg12-research.log
      - name: P0 observation tool tests
        working-directory: scripts/tg12-p0-research
        shell: bash
        run: |
          set -o pipefail
          swift test -c release 2>&1 | tee p0-observer.log
      - name: Preserve complete research JSON in log and summary
        if: always()
        shell: bash
        run: |
          # This repository allows checkout/setup-python actions only. Use native
          # logs/summary for evidence; do not change the Actions allowlist.
          research_file=swift/TacticalGoCore/tg12-research.json
          if [[ -f "$research_file" ]]; then
            echo TG12_RESEARCH_FILE_JSON_BEGIN
            cat "$research_file"
            echo
            echo TG12_RESEARCH_FILE_JSON_END
            sha256sum "$research_file"
            {
              echo '### TG12 bounded research output'
              echo '```json'
              cat "$research_file"
              echo
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
